<!DOCTYPE html>
<html>
  <head>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@v0.184.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.184.0/examples/jsm/",
        "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.20/+esm",
        "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js"
      }
    }
    </script>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Western Legends</title>
    <link rel="stylesheet" href="./style/game.css">
    <link rel="stylesheet" href="./style/stable.css">
    <link rel="stylesheet" href="./style/gunCatalog.css">
    <link rel="stylesheet" href="./style/inventory.css">
  </head>
  <body>
    <header>
      <span class="corner corner-tl"></span> 
      <span class="corner corner-tr"></span> 
      <span class="corner corner-bl"></span> 
      <span class="corner corner-br"></span> 

      <div class="hdr-avatar-wrap">
        <div class="hdr-avatar" id="hdr-avatar" aria-label="Player menu">
          <img src="img/cowboy_icon.png" alt="">
        </div>
        <div class="hdr-dropdown" id="hdr-dropdown">
          <p class="hdr-dropdown-name" id="hdr-player-name">Stranger</p>
          <button class="hdr-dropdown-btn" id="hdr-logout">&#x2715; &nbsp; End Session</button>
        </div>
      </div>

      <div class="hdr-stats">

        <div class="hdr-gold">
          <img src="img/dolar.png" class="hdr-gold-icon">
          <span id="hdr-gold-val">$ 0</span>
        </div>

        <div class="hdr-stat-group">
          <span class="hdr-stat-label">Energy</span>
          <div class="hdr-bar-row" id="hdr-energy-pips"></div>
        </div>

        <div class="hdr-stat-group">
          <span class="hdr-stat-label">XP</span>
          <div class="hdr-bar-row">
            <div class="hdr-bar-single">
              <div class="hdr-bar-fill xp" id="hdr-xp-bar" style="width:0%"></div>
            </div>
            <span class="hdr-bar-lvl" id="hdr-lvl">LVL 1</span>
          </div>
        </div>


      </div>
    </header>

    <main>
      <div class="linha">

        <div class="frame">

          <span class="corner corner-tl"></span> 
          <span class="corner corner-tr"></span> 
          <span class="corner corner-bl"></span> 
          <span class="corner corner-br"></span> 


          <div class="canvas_tabs">
            <button class="tabs_button canvas active" data-target="scenario" id="town_tab">Town</button>
            <button class="tabs_button canvas" data-target="map" id="map_tab">MAP</button>

          </div>

          <div class="canvas_wrap active" id="scenario">
            <button class="return_button hud_button occult" id="return_button">RETURN</button>
            <button class="enter_button hud_button occult" id="enter_button">ENTER</button>
            <button class="leave_button hud_button occult" id="leave_button">LEAVE</button>
            <button class="hud_button" data-active="false" id="camera_button"><i class="fa-solid fa-video" style="color: rgb(217, 8, 8);"></i></button>
            <canvas class="canvas" id="scenario_canvas" ></canvas>
          </div>

          <div class="canvas_wrap" id="map"> 
            <div class="map_panel">
              <div class="map_display">
                <img src="img/Map.png" alt="Map">

                <!-- SVG injected here by JS -->
                <div id="player_pin" class="player_pin"><img src="img/cowboy_icon.png"></div>

                <div class="pin" style="left: 43.5%; top: 50%;" data-spot="Valentine"><img src="img/pin.png" ></div>
                <div class="pin" style="left: 78%; top: 64%;" data-spot="Wellington"><img src="img/pin.png" ></div>
                <div class="pin" style="left: 56%; top: 70%;" data-spot="Quarry"><img src="img/pin.png" ></div>
                <div class="pin" style="left: 26.5%; top: 76%;" data-spot="Terminus"><img src="img/pin.png" ></div>
                <div class="pin" style="left: 18.5%; top: 54%;" data-spot="Redrock"><img src="img/pin.png" ></div>
                <div class="pin" style="left: 23.5%; top: 27%;" data-spot="Armadillo"><img src="img/pin.png" ></div>
                <div class="pin" style="left: 36%; top: 34%;" data-spot="Comanche_Tribe"><img src="img/pin.png" ></div>
                <div class="pin" style="left: 61.5%; top: 38.5%;" data-spot="Thief_Camp"><img src="img/pin.png" ></div>
              </div>
            </div>
          </div>  
        </div>
        

        <section class="controles">
          <div class="frame">

            <span class="corner corner-tl"></span> 
            <span class="corner corner-tr"></span> 
            <span class="corner corner-bl"></span> 
            <span class="corner corner-br"></span> 

            <div class="sidemenu_tabs">
              <button class="tabs_button sidemenu" data-target="overview" id="overview_tab">OVERVIEW</button>
              <button class="tabs_button sidemenu active" data-target="inventory" id="inventory_tab">INVENTORY</button>
            </div>

            <div class="sidemenu_wrap " id="overview">
              <div class="overview"></div>
            </div>

            <div class="sidemenu_wrap active" id="inventory">

              <div class="inventory">
                <!-- Player header + reputation -->
                <div class="inv-header">
                  <div class="inv-avatar">
                    <img src="" alt="player" id="inv-avatar-img" />
                    <p class="inv-avatar-name" id="inv-avatar-name"></p>
                  </div>
                  
                  <div class="inv-rep-wrap">
                    <div class="inv-rep-label">
                      <span>VILLAIN</span>
                      <span>HERO</span>
                    </div>
                    <div class="inv-rep-track">
                      <div class="inv-rep-fill-pos" id="inv-rep-pos"></div>
                      <div class="inv-rep-fill-neg" id="inv-rep-neg"></div>
                      <div class="inv-rep-center"></div>
                      <div class="inv-rep-arrow" id="inv-rep-arrow">▼</div>
                    </div>
                    
                    <div class="inv-rep-icons">
                      <img src="img/icons/bandit.png" alt="Villain" class="inv-rep-icon">
                      <img src="img/icons/sheriff.png" alt="Hero" class="inv-rep-icon">
                  </div>
                  </div>
                </div>

                <!-- Special slots -->
                <div class="inv-special-slots">
                  <div class="inv-special-slot">
                    <div class="inv-slot-box" id="slot-gun">
                      <img src="" alt="gun" />
                    </div>
                    <span class="inv-slot-label">GUN</span>
                  </div>
                  <div class="inv-special-slot">
                    <div class="inv-slot-box" id="slot-horse">
                      <img src="" alt="horse" />
                    </div>
                    <span class="inv-slot-label">HORSE</span>
                  </div>
                  <div class="inv-special-slot">
                    <div class="inv-slot-box" id="slot-case">
                      <img src="" alt="coat" />
                    </div>
                    <span class="inv-slot-label">CASE</span>
                  </div>
                </div>

                <div class="divider">()</div>

                <h2 class="inv-grid-title">(INVENTORY)</h2>
                <div class="inv-grid" id="player-inv-grid">
                  <!-- Inventory items goes here -->
                </div>

              </div>
            </div>


          </div>
        </section>
      </div>

    <div id="baloon"></div>
    <div id="item-baloon"></div>

      <!-- NOTIFICATION WINDOW -->
    <div class="notification_overlay hidden" id="notification_overlay">
      <div class="notification_window">

        <div class="notification_header">
          <h1 id="notification_title">Notification</h1>
        </div>

        <div class="notification_content" id="notification_content">
          Content goes here...
        </div>

        <div class="notification_buttons" id="notification_buttons">
          <!-- Buttons injected dynamically -->
        </div>

      </div>
    </div>
    
    </main>

    <footer>
      <img src="/img/logo.png" alt="">
    </footer>

    <script type="module" src="./js/main.js"></script>
    
  </body>
</html>

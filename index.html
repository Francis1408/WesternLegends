<!DOCTYPE html>
<html>
  <head>
      <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Western Legends</title>
    <link rel="stylesheet" href="style/basic.css">
    <link rel="stylesheet" href="style/layout.css">
  </head>
  <body>
    <header>
      <h1>HEADER</h1>
    </header>

    <main>
      <div class="linha">
        <div class="frame">
          <div class="canvas-tabs">
            <button class="tabs_button active" data-target="wrap-main">Town</button>
            <button class="tabs_button" data-target="wrap-secondary">Map</button>
          </div>

          <div class="canvas-wrap active" id="scenario">
            <button class="return_button hud_button occult" id="return_button">RETURN</button>
            <button class="enter_button hud_button occult" id="enter_button">ENTER</button>
            <button class="leave_button hud_button occult" id="leave_button">LEAVE</button>
            <button class="hud_button" data-active="false" id="camera_button"><i class="fa-solid fa-video" style="color: rgb(217, 8, 8);"></i></button>
            <canvas class="canvas" id="scenario_canvas" ></canvas>
          </div>

          <div class="canvas-wrap"> </div>

        </div>


        <section class="controles">
            <h1>INVENTARIO</h1>
        </section>
      </div>
    </main>

    <footer>
        <h1>FOOTER</h1>
    </footer>

    <script type="module" src="js/main.js"></script>
    
  </body>
</html>
